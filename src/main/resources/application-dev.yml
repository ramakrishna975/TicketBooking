# Dev profile: in-memory H2, Hibernate creates the schema (no Flyway here).
spring:
  datasource:
    url: jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # H2 dev is the ONLY place ddl-auto is not 'validate'.
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
